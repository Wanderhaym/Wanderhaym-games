<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <title>Wanderhaym Games — настоящий интерактивный 3D-мир</title>
  <meta name="description" content="Путешествуй по настоящей Three.js 3D-сцене Wanderhaym и запускай игры прямо во ВКонтакте.">
  <meta name="theme-color" content="#040509">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://wanderhaym.github.io/Wanderhaym-games/">
  <meta property="og:title" content="Wanderhaym Games — интерактивный 3D-мир">
  <meta property="og:description" content="Настоящая WebGL-сцена с перспективной камерой, объёмными карточками и живым кузнецом Wanderhaym.">
  <link rel="stylesheet" href="/wanderhaym-loader/wanderhaym-loader.css?v=1.0.2">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/loader-bootstrap.css">
</head>
<body>
  <div id="loaderBootstrap" role="status" aria-live="polite">
    <strong>WANDERHAYM</strong>
    <small data-boot-status>ПОДГОТАВЛИВАЮ КУЗНЮ</small>
    <noscript><small>Для запуска включите JavaScript.</small></noscript>
  </div>

  <canvas id="world" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="hud">
    <a class="brand" id="homeButton" href="https://vk.ru/wanderhayms" target="_blank" rel="noopener" aria-label="Открыть сообщество Wanderhaym ВКонтакте">
      <span class="brand__mark">W</span>
      <span><strong>Wanderhaym</strong><small>игровые миры</small></span>
    </a>
    <div class="portal-hud" id="portalHud" data-state="cold" aria-live="polite">
      <div class="portal-hud__top">
        <span id="portalState">РАЗОГРЕЙ ЯДРО</span>
        <strong id="portalHeatValue">0%</strong>
      </div>
      <div class="portal-hud__track" aria-hidden="true"><i id="portalHeatBar"></i></div>
      <small id="portalDestination">СЛУЧАЙНЫЙ МИР</small>
    </div>
    <nav class="hud__actions" aria-label="Навигация автора">
      <button class="sound" id="soundButton" type="button" aria-label="Включить музыку" aria-pressed="false">
        <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Звук</span>
      </button>
      <button class="quiet" id="quietButton" type="button" aria-label="Включить спокойные эффекты" aria-pressed="false">
        <span aria-hidden="true">◌</span><span>Эффекты</span>
      </button>
      <a class="support" id="supportButton" href="https://www.donationalerts.com/r/wanderhaym" target="_blank" rel="noopener">Поддержать</a>
    </nav>
  </header>

  <div class="teleport-counter" id="teleportCounter" data-state="connecting" aria-live="polite">
    <span>ВСЕГО ТЕЛЕПОРТАЦИЙ</span>
    <strong id="teleportCounterValue">…</strong>
  </div>
  <div class="interaction-coach" id="interactionCoach" data-state="cold" aria-live="polite">Нажми на ядро: кот начнёт ковать портал</div>
  <div class="card-tap-coach" id="cardTapCoach" data-state="hidden" aria-live="polite" aria-hidden="true">
    Ещё раз — открыть игру ↗
  </div>

  <main class="ui" id="ui">
    <section class="game-info" aria-live="polite">
      <div class="game-info__meta">
        <span id="gameTag">Игра</span>
      </div>
      <h2 id="gameTitle">Wanderhaym Games</h2>
      <button class="game-launch game-launch--mobile" type="button" data-game-launch aria-label="Открыть текущую игру">
        <span>Играть</span>
        <i aria-hidden="true">↗</i>
      </button>
      <p id="gameDescription">Загрузка трёхмерного мира…</p>
    </section>

    <button class="game-launch game-launch--desktop" type="button" data-game-launch aria-label="Открыть текущую игру">
      <span id="gameLaunchLabel">Играть в «Wanderhaym Games»</span>
      <i aria-hidden="true">↗</i>
    </button>

    <nav class="controls" aria-label="Переключение игр">
      <button id="previousButton" type="button" aria-label="Предыдущая игра">←</button>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <button id="nextButton" type="button" aria-label="Следующая игра">→</button>
    </nav>

    <p class="world-label" aria-hidden="true"><span>WANDERHAYM</span><span>МИРЫ, КОТОРЫЕ ОТКРЫВАЮТСЯ УДАРОМ</span></p>
  </main>

  <nav class="sr-only" id="accessibleGames" aria-label="Все игры Wanderhaym"></nav>
  <audio id="music" loop preload="none" playsinline></audio>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
